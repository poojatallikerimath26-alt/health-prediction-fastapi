{% macro patient_fields(form) %}
  <div class="col-md-4">
    <label class="form-label" for="full_name">Full name</label>
    <input class="form-control" id="full_name" name="full_name" value="{{ form.get('full_name', '') }}" required>
  </div>
  <div class="col-md-2">
    <label class="form-label" for="dob">Date of birth</label>
    <input class="form-control" id="dob" name="dob" placeholder="dd/mm/yyyy" value="{{ form.get('dob', '') }}" required>
  </div>
  <div class="col-md-3">
    <label class="form-label" for="email">Email</label>
    <input class="form-control" id="email" name="email" value="{{ form.get('email', '') }}" required>
  </div>
  <div class="col-md-1">
    <label class="form-label" for="glucose">Glucose</label>
    <input class="form-control" id="glucose" name="glucose" value="{{ form.get('glucose', '') }}" required>
  </div>
  <div class="col-md-1">
    <label class="form-label" for="haemoglobin">Haem.</label>
    <input class="form-control" id="haemoglobin" name="haemoglobin" value="{{ form.get('haemoglobin', '') }}" required>
  </div>
  <div class="col-md-1">
    <label class="form-label" for="cholesterol">Chol.</label>
    <input class="form-control" id="cholesterol" name="cholesterol" value="{{ form.get('cholesterol', '') }}" required>
  </div>
{% endmacro %}

{% macro error_list(errors) %}
  {% if errors %}
  <div class="alert alert-danger">
    <strong>The record was not saved:</strong>
    <ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
  </div>
  {% endif %}
{% endmacro %}
